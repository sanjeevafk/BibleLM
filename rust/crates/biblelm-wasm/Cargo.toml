[package]
name = "biblelm-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
biblelm-types = { path = "../biblelm-types" }
biblelm-index = { path = "../biblelm-index" }
biblelm-graph = { path = "../biblelm-graph" }
biblelm-morph = { path = "../biblelm-morph" }
biblelm-pipeline = { path = "../biblelm-pipeline" }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3"
