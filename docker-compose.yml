# =============================================================================
# BibleLM — Docker Compose (self-hosted stack)
#
# Usage:
#   cp .env.example .env.local          # fill in API keys
#   docker compose up --build           # first run: builds image
#   docker compose up                   # subsequent runs (uses cache)
#   docker compose down                 # stop
#
# Services:
#   biblelm   — Vite client + Hono Worker via wrangler dev (port 8787)
#   redis     — Plain Redis store (RESP on 6379, internal only)
#   redis-rest — Upstash REST gateway (serverless-redis-http) in front of redis.
#               REQUIRED because @upstash/redis speaks REST, not RESP.
#               Remove redis + redis-rest if you rely on Upstash cloud.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # BibleLM application (Worker served locally by wrangler dev / workerd)
  # ---------------------------------------------------------------------------
  biblelm:
    build:
      context: .
      dockerfile: Dockerfile
    image: biblelm:latest
    container_name: biblelm
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # ── LLM Providers ──────────────────────────────────────────────────────
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Canonical: HF_TOKEN. HUGGINGFACE_API_KEY kept as legacy alias.
      HF_TOKEN: ${HF_TOKEN:-${HUGGINGFACE_API_KEY:-}}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-${HF_TOKEN:-}}

      # ── Rate Limiting / Caching ─────────────────────────────────────────────
      # Point at the local REST gateway defined below (NOT stock Redis: stock
      # redis:7-alpine speaks RESP, while @upstash/redis requires REST).
      # Override with Upstash cloud credentials if you prefer the managed service.
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-http://redis-rest}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-local-dev-token}

      # ── Data store (optional) ───────────────────────────────────────────────
      # Without Turso the app falls back to the bundled static data files.
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}

      # ── Runtime ────────────────────────────────────────────────────────────
      NODE_ENV: production
      # Workers AI needs Cloudflare credentials; off for self-hosting.
      ENABLE_NEURAL_RERANK: "0"
    depends_on:
      redis:
        condition: service_healthy
      redis-rest:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Local Redis store (RESP only — NOT directly usable by @upstash/redis).
  # Provides persistence for the REST gateway below.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: biblelm-redis
    restart: unless-stopped
    expose:
      - "6379"
    # Persist data across restarts so the response cache survives container
    # recreation. Remove the volume mount to run fully ephemeral.
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Upstash REST gateway (serverless-redis-http) — translates @upstash/redis
  # REST calls to RESP for the `redis` service above.
  # Self-hosted equivalent of Upstash cloud REST API for local/dev parity.
  # ---------------------------------------------------------------------------
  redis-rest:
    image: hiett/serverless-redis-http:latest
    container_name: biblelm-redis-rest
    restart: unless-stopped
    expose:
      - "80"
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-local-dev-token}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
    driver: local
